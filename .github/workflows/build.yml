name: Build Kivy APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ownership
        run: chown -R 1000:1000.
      - name: Build APK
        run: buildozer android debug --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMacroDroid-Kivy-APK
          path: bin/*.apk
