name: Build Kivy APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip python3-setuptools python3-dev build-essential libssl-dev libffi-dev libncurses5-dev libncursesw5-dev zlib1g-dev libbz2-dev libreadline-dev libsqlite3-dev wget llvm libncurses5 libncursesw5 xz-utils tk-dev libxml2-dev libxmlsec1-dev libffi-dev liblzma-dev
          pip install --upgrade pip
          pip install buildozer cython==0.29.36 kivy pyjnius
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Build with Buildozer
        run: |
          ls -la
          cat buildozer.spec
          yes | sdkmanager --licenses || true
          buildozer android debug --verbose
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VideoToMacroDroid-Kivy-APK
          path: |
            **/bin/*.apk
            bin/*.apk
            *.apk
          if-no-files-found: error
